# Business rules the agent must follow, grouped by the tables they apply to.
# Identifiers in backticks are validated against the dbt manifest;
# write literal values in single quotes ('retired'), never in backticks.
rules:
  - id: entries_vs_starts
    tables: [fct_race_results, fct_sprint_results]
    text: >-
      Rows are entries, not starts: drivers with `result_type` 'failed_to_qualify'
      or 'withdrawn' never started. To count starts or races driven, filter
      `is_race_start` (`is_sprint_start` for sprints).

  - id: shared_cars
    tables: [fct_race_results]
    text: >-
      In the 1950s drivers could share a car, so one driver can have up to three
      rows in the same race. Count races, wins and podiums with
      count(distinct race_id), never count(*).

  - id: season_standings
    tables: [fct_driver_standings, fct_constructor_standings, dim_race, fct_race_results]
    text: >-
      Standings are cumulative after each race. Final season totals and champions
      come from the row of the season's last race: join `dim_race` and filter
      `is_season_finale`; the champion has `championship_position` = 1. Do not
      rebuild season totals by summing `fct_race_results.points`: sprint points
      live in `fct_sprint_results` and early seasons only counted each driver's
      best results.

  - id: grand_prix_vs_sprint
    tables: [fct_race_results, fct_sprint_results]
    text: >-
      A race, win or podium means the Grand Prix (`fct_race_results`). Sprints
      (2021 onwards) are separate events in `fct_sprint_results`: use them only
      when the question mentions sprints.

  - id: pole_vs_grid
    tables: [fct_qualifying, fct_race_results]
    text: >-
      Pole position is `is_pole` in `fct_qualifying`, which is complete only from
      2003. For pole counts that include earlier seasons, use `grid_position` = 1
      in `fct_race_results` as a proxy and say so: the starting slot can differ
      from qualifying because of penalties. `grid_position` = 0 means a pit lane
      start or no slot: exclude it from averages.

  - id: pit_stop_outliers
    tables: [fct_pit_stops]
    text: >-
      `pit_stop_duration_ms` is the time spent in the pit lane, from entry to
      exit, not the stationary time of the crew (a few seconds). It depends on
      the length of each pit lane, so only compare stops within the same circuit.
      Stops made under a red flag last several minutes: leave them out of
      duration statistics (averages, fastest or slowest stops) with
      `pit_stop_duration_ms` < 60000. When counting stops, count all of them
      unless the user asks to leave red flag stops out.

  - id: missing_is_not_zero
    tables: [fct_lap_times, fct_qualifying, fct_pit_stops, fct_sprint_results, fct_constructor_standings, fct_race_results]
    text: >-
      Coverage varies by table (see each table description). Also,
      `fct_qualifying` starts in 1994 but is complete only from 2003, the
      constructors' championship starts in 1958 and the fastest lap columns of
      `fct_race_results` (`fastest_lap_time_ms` and related) start in 2004, with
      a couple of races without data. Outside the covered seasons data is
      missing, not zero: tell the user instead of answering 0.

  - id: name_matching
    tables: [dim_driver, dim_constructor, dim_race]
    text: >-
      Names keep their original accents and may contain apostrophes
      (d'Ambrosio). Full names can also be shorter than the usual name (Juan
      Fangio, not Juan Manuel Fangio), so match drivers on `last_name` or a
      distinctive part of the name. Users often type names without accents:
      compare them accent- and case-insensitively on both sides, for example
      strip_accents(lower(full_name)) LIKE '%raikkonen%'. Escape apostrophes in
      literals by doubling them: 'd''Ambrosio'. Applies to `full_name`,
      `last_name`, `constructor_name`, `race_name` and `circuit_name`.

  - id: car_number_is_not_identity
    tables: [fct_race_results, fct_qualifying, fct_sprint_results, dim_driver]
    text: >-
      `car_number` is the number on the car in that event, not a driver
      identifier: it changes across seasons and teams. Identify drivers by
      `driver_id`. `dim_driver.permanent_number` is the number a driver keeps
      across seasons (chosen from 2014 onwards).

  - id: indianapolis_500
    tables: [dim_race, fct_race_results]
    text: >-
      From 1950 to 1960 the Indianapolis 500 (`race_name` = 'Indianapolis 500')
      counted for the championship. Keep it unless the user asks otherwise: it
      is part of the official statistics. It explains outliers such as
      `laps_completed` up to 200 and drivers whose only starts are at
      Indianapolis.
