  # Known data issue, not used here: is_pole (fastest in qualifying) differs
  # from the official pole after qualifying exclusions, grid penalties and in
  # 2021, when the sprint winner took pole. The data gives Lewis Hamilton 107
  # poles instead of the official 104; cases include Spain 2012 (excluded from
  # qualifying) and Britain 2021 (pole went to the sprint winner).
  - id: pole_italy_2024
    level: 1
    tags: [qualifying]
    question: Who took pole position at the 2024 Italian Grand Prix?
    sql: |
      SELECT d.full_name
      FROM marts.fct_qualifying AS q
      JOIN marts.dim_race AS r USING (race_id)
      JOIN marts.dim_driver AS d USING (driver_id)
      WHERE r.season = 2024 AND r.race_name = 'Italian Grand Prix' AND q.is_pole
    expected:
      - [Lando Norris]

  - id: michael_schumacher_wins_2004
    level: 2
    tags: [metric]
    question: How many races did Michael Schumacher win in 2004?
    sql: |
      SELECT count(DISTINCT rr.race_id) FILTER (WHERE rr.is_win) AS wins
      FROM marts.fct_race_results AS rr
      JOIN marts.dim_race AS r USING (race_id)
      JOIN marts.dim_driver AS d USING (driver_id)
      WHERE r.season = 2004 AND d.full_name = 'Michael Schumacher'
    expected:
      - [13]

  - id: most_wins_2024
    level: 2
    tags: [aggregation, ranking]
    question: Which driver won the most Grand Prix in 2024, and how many?
    sql: |
      SELECT d.full_name, count(DISTINCT rr.race_id) AS wins
      FROM marts.fct_race_results AS rr
      JOIN marts.dim_race AS r USING (race_id)
      JOIN marts.dim_driver AS d USING (driver_id)
      WHERE r.season = 2024 AND rr.is_win
      GROUP BY d.full_name
      ORDER BY wins DESC
      LIMIT 1
    expected:
      - [Max Verstappen, 9]

