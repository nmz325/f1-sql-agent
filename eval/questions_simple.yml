# Simple evaluation set: many short questions (one fact or one count), in
# English and Spanish. Cheap to run often, so it catches regressions in the
# basics: champions, race winners, name spelling and simple counts.
#
# Same rules as questions.yml:
# - None of these questions may appear in semantic/examples.yml.
# - `expected` holds the values the question asks for, cross-checked against
#   well-known F1 statistics (not copied from the database).
# - Levels: 1 a single fact, 2 a count or a simple ranking.
# Run `uv run f1-eval check --set simple` after changing the data or this file.
questions:
  # --- Champions and standings ---------------------------------------------------
  - id: champion_2008
    level: 1
    tags: [standings]
    question: Who won the 2008 drivers' championship?
    sql: |
      SELECT d.full_name
      FROM marts.fct_driver_standings AS st
      JOIN marts.dim_race AS r USING (race_id)
      JOIN marts.dim_driver AS d USING (driver_id)
      WHERE r.season = 2008 AND r.is_season_finale AND st.championship_position = 1
    expected:
      - [Lewis Hamilton]

  - id: champion_2019_points
    level: 1
    tags: [standings]
    question: How many points did the 2019 drivers' champion score, and who was he?
    sql: |
      SELECT d.full_name, st.championship_points
      FROM marts.fct_driver_standings AS st
      JOIN marts.dim_race AS r USING (race_id)
      JOIN marts.dim_driver AS d USING (driver_id)
      WHERE r.season = 2019 AND r.is_season_finale AND st.championship_position = 1
    expected:
      - [Lewis Hamilton, 413]

  - id: constructors_champion_2010
    level: 1
    tags: [standings]
    question: Which team won the 2010 constructors' championship?
    sql: |
      SELECT c.constructor_name
      FROM marts.fct_constructor_standings AS st
      JOIN marts.dim_race AS r USING (race_id)
      JOIN marts.dim_constructor AS c USING (constructor_id)
      WHERE r.season = 2010 AND r.is_season_finale AND st.championship_position = 1
    expected:
      - [Red Bull]

  - id: constructors_champion_2024
