      JOIN marts.dim_driver AS d USING (driver_id)
      JOIN marts.dim_constructor AS c USING (constructor_id)
      WHERE r.season = 2007 AND d.full_name = 'Lewis Hamilton'
    expected:
      - [McLaren]

  # --- Driver counts -----------------------------------------------------------------
  - id: nico_rosberg_wins
    level: 2
    tags: [metric]
    question: How many Grand Prix did Nico Rosberg win?
    sql: |
      SELECT count(DISTINCT rr.race_id) FILTER (WHERE rr.is_win) AS wins
      FROM marts.fct_race_results AS rr
      JOIN marts.dim_driver AS d USING (driver_id)
      WHERE d.full_name = 'Nico Rosberg'
    expected:
      - [23]

