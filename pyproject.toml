[project]
name = "f1-sql-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nmz325", email = "nahuelms325@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "kagglehub>=1.0.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
f1-download = "f1_sql_agent.ingest.download:main"
f1-sql-agent = "f1_sql_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
# Keep ruff's default rules and add import sorting (I),
# modern syntax upgrades (UP) and common bug patterns (B)
extend-select = ["I", "UP", "B"]
